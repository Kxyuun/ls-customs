<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Back — LS Customs</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<main class="auth-main">
  <div class="auth-card">
    <p class="auth-eyebrow mono">ACCOUNT LOGIN</p>
    <h1>Welcome Back</h1>
    <p class="auth-sub mono">Sign in to your LS Customs account.</p>

    <div class="auth-panel">
      <form>
        <div class="field">
          <label>Email Address</label>
          <div class="field-input-wrap">
            <input type="email" name="email" placeholder="ENTER EMAIL" maxlength="50" required>
          </div>
        </div>

        <div class="field">
          <label>Password</label>
          <div class="field-input-wrap">
            <input type="password" name="password" placeholder="ENTER PASSWORD" minlength="8" maxlength="32" required>
            <button type="button" class="field-toggle mono">Show</button>
          </div>
        </div>

        <button type="submit" class="auth-submit">Login &rarr;</button>
      </form>

      <p class="auth-switch mono">Need an account? <a href="signup.html">Register here.</a></p>
    </div>
  </div>
</main>

<footer class="auth-footer">
  <p>&copy; 2026 LS CUSTOMS — Pasay City, PH</p>
</footer>

<script src="script.js"></script>
</body>
</html>
