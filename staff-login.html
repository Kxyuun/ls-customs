<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Access — LS Customs</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<main class="auth-main">
  <div class="auth-card">
    <p class="auth-eyebrow mono">STAFF ACCESS</p>
    <h1>Team Login</h1>
    <p class="auth-sub mono">For LS Customs staff and admin accounts only.</p>

    <div class="auth-panel">
      <form id="staffLoginForm">
        <div class="field">
          <label>Email Address</label>
          <div class="field-input-wrap">
            <input type="email" name="email" placeholder="ENTER EMAIL" required>
          </div>
        </div>

        <div class="field">
          <label>Password</label>
          <div class="field-input-wrap">
            <input type="password" name="password" placeholder="ENTER PASSWORD" required>
            <button type="button" class="field-toggle mono">Show</button>
          </div>
        </div>

        <p class="booking-error mono" id="staffLoginError">Enter an email and password to continue.</p>

        <button type="submit" class="auth-submit">Login &rarr;</button>
      </form>

      <p class="auth-switch mono">Not staff? <a href="login.html">Customer login here.</a></p>
    </div>
  </div>
</main>

<footer class="auth-footer">
  <p>&copy; 2026 LS CUSTOMS — Pasay City, PH</p>
</footer>

<script src="script.js"></script>
<script src="staff-login.js"></script>
</body>
</html>
